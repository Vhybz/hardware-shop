  <!-- PWA Service Worker Registration for Complete Offline Operation -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('[PWA SW] Service Worker registered successfully:', reg.scope);
        }).catch(function(err) {
          console.warn('[PWA SW] Service Worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- PWA Install Intercept Script -->
  <script>
    let pwaDeferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa_install_ready'));
    });

    window.checkPwaCanInstall = function() {
      return pwaDeferredPrompt !== null;
    };

    window.promptPwaInstallation = async function() {
      if (pwaDeferredPrompt) {
        pwaDeferredPrompt.prompt();
        const choice = await pwaDeferredPrompt.userChoice;
        pwaDeferredPrompt = null;
        return choice.outcome === 'accepted';
      }
      return false;
    };
  </script>
</head>
